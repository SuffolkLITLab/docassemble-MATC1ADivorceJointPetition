---
# Included interview logic for the umbrella joint-petition flow.
# The umbrella main file must define the bundles that include
# jointmotiontofilemarriagecertificatelate_attachment and set the court/role globals.
objects:
  - attorneys: ALPeopleList.using(there_are_any=True)
  - users: ALPeopleList.using(ask_number=False, target_number=2)
---
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_jointmotiontofilemarriagecertificatelate
code: |
  # The parent packet has already collected the parties and marriage details
  # on id: Relationship background; the code blocks below copy them.
  marriage_city
  marriage_state
  marriage_country
  marriage_proof_delay_reason
  marriage_proof_delay_action_plan
  users[0].phone_number
  trial_court.division
  users[1].phone_number
  users[0].address.address
  signature_date
  users[1].address.address
  if not defined("docket_number"):
    docket_number = ""
  interview_order_jointmotiontofilemarriagecertificatelate = True
---
id: Joint_motion_to_file_marriage_certificate_late
continue button field: jointmotiontofilemarriagecertificatelate_intro
question: |
  Joint motion to file marriage certificate late
subquestion: |
  This interview will help you file a joint motion to file marriage certificate late if not submitting with petition.
  
  Before you get started, please gather:
  
  1. Marriage information (Date, location)
  2. Information about how to obtain a certified copy of your marriage certificate and/or translation. 
   
  
  When you are finished, you will need to:
  
  1. File this motion with your joint petition. 
  2. Obtain a certified copy of your marriage certificate and/or translation and file with the court as soon as possible.

  If you are a couple filing a joint petition for divorce you can use this interview to file a joint motion to file marriage certificate late if not submitting certified copy of marriage certificate with petition.

  Most people take about 10 minutes to complete this interview.
---
sets: 
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix  
id: Petitioner name fields
question: |
  % if i == 0:
  Petitioner A
  % elif i == 1:
  Petitioner B
  % else:
  Petitioner Name
  % endif
subquestion: |
  % if i == 1:
  Who is ${ users[0] }'s spouse?
  % else:
  What is your name?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: users_limit
depends on:
  - users
code: |
  users.there_is_another = (len(users) < 2)
---
comment: |
  The motion's marriage place comes from id: Relationship background. These
  recompute if the location is edited on a review screen.
depends on:
  - marriage_location_city
code: |
  marriage_city = marriage_location_city
---
depends on:
  - marriage_location_state
code: |
  marriage_state = marriage_location_state
---
depends on:
  - marriage_location_country
code: |
  marriage_country = country_name(marriage_location_country) if marriage_location_country else ""
---
id: Certified marriage certificate
question: |
  Certified marriage certificate
fields:
  - "Do you already have a certified copy of your marriage certificate?": has_certified_marriage_certificate
    datatype: yesnoradio
  - "Upload your certified marriage certificate (optional)": uploaded_marriage_certificate
    datatype: file
    required: False
    show if:
      variable: has_certified_marriage_certificate
      is: True
---
id: Reason for Delay
question: |
  Reason for Delay
subquestion: |
  Tell the court two things:

  1. **The reason:** why you do not have a certified copy of your marriage certificate yet.
  2. **The plan:** what you have done to get it, and when you expect to file it.

  You can copy one of these examples, then edit it to match your situation:

  ${ collapse_template(order_certified_copy_example) }
  ${ collapse_template(translation_example) }
  ${ collapse_template(urgent_filing_example) }
validation code: |
  if len(marriage_proof_delay_action_plan.split()) < 8:
    validation_error("Say what you have done to get the certified copy and when you expect to file it. For example: who you ordered it from, on what date, and when you expect it.", field="marriage_proof_delay_action_plan")
fields:
  - "Reason for marriage certificate delay": marriage_proof_delay_reason
    input type: area
  - "Plan to obtain and submit certified copy of marriage certificate": marriage_proof_delay_action_plan
    input type: area
    help: |
      For example: "We ordered a certified copy from the Boston City Clerk on
      [date]. We expect it within two weeks and will file it with the court
      as soon as it arrives."
---
template: order_certified_copy_example
subject: |
  Example: We need to order a certified copy
content: |
  **Reason:** We were married in [city or town, state or country], and we do not have a certified copy of our marriage certificate yet.

  **Plan:** We requested a certified copy from the [city or town clerk, or state or country records office] on [date]. We expect to receive it by [date] and will file it with the court as soon as it arrives.
---
template: translation_example
subject: |
  Example: We need a certified translation
content: |
  **Reason:** Our marriage certificate is not in English, and the court needs a certified English translation.

  **Plan:** We asked [translator or service] for a certified translation on [date] and expect it by [date]. We will file the certificate and the translation together as soon as they are ready.
---
template: urgent_filing_example
subject: |
  Example: We need to file now while waiting for documents
content: |
  **Reason:** We need to file our joint petition now so our case can move forward. Our certified marriage certificate has not arrived yet because [brief reason, such as it is still being processed or mailed].

  **Plan:** We requested the certified copy from [office] on [date]. We will file it (and a certified translation, if needed) as soon as we receive it.
---
id: preview jointmotiontofilemarriagecertificatelate
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_jointmotiontofilemarriagecertificatelate'), label='Edit answers', color='info') }
  
  Please come back to this window to finish and sign your form.
continue button field: jointmotiontofilemarriagecertificatelate_preview_question    
---
code: |
  signature_fields = ['users[0].signature', 'users[1].signature']
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on 
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]

---
id: jointmotiontofilemarriagecertificatelate review screen
event: review_jointmotiontofilemarriagecertificatelate
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: marriage_location_state
    button: |
      **State where marriage took place**:
      ${ marriage_state }
  - Edit: marriage_proof_delay_action_plan
    button: |
      **Plan to fix marriage proof delay**:
      ${ marriage_proof_delay_action_plan }
  - Edit: trial_court
    button: |
      **Trial court**
  
      % if defined("trial_court.division"):
      * division: ${ trial_court.division }
      % endif
  - Edit: marriage_location_city
    button: |
      **City where marriage took place**:
      ${ marriage_city }
  - Edit: marriage_date
    button: |
      **Date of marriage ceremony**:
      ${ marriage_date }
  - Edit: marriage_location_country
    button: |
      **Country where marriage took place**:
      ${ marriage_country }
  - Edit: signature_date
    button: |
      **Date of Signature**:
      ${ signature_date }
  - Edit: i
    button: |
      **I**:
      ${ i }
  - Edit: attorneys.revisit
    button: |
      **Attorneys**

      % for item in attorneys:
        * ${ item }
      % endfor
  - Edit: marriage_proof_delay_reason
    button: |
      **Reason for marriage proof delay**:
      ${ marriage_proof_delay_reason }
  - Edit: docket_number
    button: |
      **Docket number**:
      ${ docket_number }
  - Edit: international_marriage
    button: |
      **Marriage was outside of United States**:
      ${ word(yesno(international_marriage)) }
---
id: edit users
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Phone number: |
      row_item.phone_number if defined("row_item.phone_number") else ""
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
edit:
  - phone_number
  - signature
  - address.address
  - name.first
confirm: True

---
id: edit attorneys
continue button field: attorneys.revisit
question: |
  Edit attorneys
subquestion: |
  ${ attorneys.table }

  ${ attorneys.add_action() }
---
table: attorneys.table
rows: attorneys
columns:
  - Bbo number: |
      row_item.bbo_number if defined("row_item.bbo_number") else ""
edit:
  - bbo_number
confirm: True

---
id: download jointmotiontofilemarriagecertificatelate
event: jointmotiontofilemarriagecertificatelate_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready. Please download it and deliver it.
  
  View, download and send your form below. Click the "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_jointmotiontofilemarriagecertificatelate'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - jointmotiontofilemarriagecertificatelate_attachment: ALDocument.using(title="Joint motion to file marriage certificate late", filename="jointmotiontofilemarriagecertificatelate", has_addendum=False, )
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
---
attachment:
  name: jointmotiontofilemarriagecertificatelate
  filename: jointmotiontofilemarriagecertificatelate
  variable name: jointmotiontofilemarriagecertificatelate_attachment[i]
  skip undefined: True
  docx template file: jointmotiontofilemarriagecertificatelate.docx
  tagged pdf: True
